<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RiojoHome</title>
<meta name="description" content="RiojoHome · Fruta, verdura y productos de La Rioja a domicilio.">
<meta name="theme-color" content="#2f5d34">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RiojoHome">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f7f3ea; --surface:#fffdf8; --surface-2:#f0eadd; --text:#24211c; --muted:#6c655a; --line:#e3dbcb;
  --green:#2f5d34; --green-2:#3d7543; --green-soft:#e2ecdc; --on-green:#ffffff;
  --wine:#8c1d38; --wine-soft:#f6e2e7; --amber:#a86400; --amber-soft:#fbeed5;
  --ring:rgba(47,93,52,.45);
  --shadow:0 1px 2px rgba(36,33,28,.05),0 6px 18px rgba(36,33,28,.06);
  --radius:16px; --tile-s:58%; --tile-l:90%;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14130f; --surface:#1e1c17; --surface-2:#29261f; --text:#f2ede3; --muted:#a8a194; --line:#36322a;
    --green:#86c088; --green-2:#9dd09e; --green-soft:#203423; --on-green:#0f1f10;
    --wine:#ec8aa0; --wine-soft:#3b1d25; --amber:#eab05a; --amber-soft:#3a2c14;
    --ring:rgba(134,192,136,.5);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --tile-s:24%; --tile-l:22%;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh}
body:has(dialog[open]){overflow:hidden}
body.has-cartbar main{padding-bottom:96px}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--green)}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.fine{font-size:12.5px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);min-width:0}
.brand svg{width:36px;height:36px;flex:none}
.brand b{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px;align-items:center;flex:none}
.cart-btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:650}
.cart-btn .count{min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--surface-2);font-size:12.5px;display:inline-grid;place-items:center}
.cart-btn.has .count{background:var(--green);color:var(--on-green)}

/* Buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--text);white-space:nowrap;position:relative}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--wine)}
.btn.block{width:100%;min-height:52px;font-size:16px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.link{background:none;border:0;padding:6px 0;color:var(--green);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--wine)}
.icon-btn{width:42px;height:42px;display:inline-grid;place-items:center;border-radius:11px;border:1px solid var(--line);background:var(--surface);flex:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>span{font-size:13px;font-weight:650;color:var(--muted)}
.field input,.field select,.field textarea,.input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:46px;font-size:16px}
.field textarea{resize:vertical;min-height:72px}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--ring)}
.field .err{color:var(--wine);font-size:12.5px;font-weight:600}
.field.invalid input,.field.invalid textarea,.field.invalid select{border-color:var(--wine)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--green)}

/* Hero & shop */
.hero{padding:26px 0 6px}
.eyebrow{color:var(--wine);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;margin-bottom:8px}
.hero h1{font-family:var(--serif);font-size:clamp(27px,5.4vw,42px);font-weight:600;letter-spacing:-.015em;max-width:22ch}
.perks{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:16px 0 0}
.perks li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.toolbar{position:sticky;top:60px;z-index:10;background:var(--bg);padding:14px 0 6px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px;color:var(--muted)}
.search:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--ring)}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:100%;font-size:16px;color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:550;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.group{margin:14px 0 30px}
.group>h2{font-family:var(--serif);font-size:21px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
@media (min-width:720px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.tile{position:relative;aspect-ratio:4/3;background:hsl(var(--h,40) var(--tile-s) var(--tile-l));display:grid;place-items:center;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .emoji{font-size:54px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.14))}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:6px}
.badge{font-size:12px;font-weight:750;padding:3px 8px;border-radius:999px;background:var(--wine);color:#fff}
.badge.amber{background:var(--amber);color:#fff}
@media (prefers-color-scheme:dark){.badge,.badge.amber{color:#1a1612}}
.card.is-out .tile>img,.card.is-out .tile>.emoji{filter:grayscale(1);opacity:.55}
.out{position:absolute;right:8px;bottom:8px;background:var(--text);color:var(--bg);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.card h3{font-size:15px;font-weight:650}
.origin{font-size:12.5px;color:var(--muted)}
.desc{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.buy{margin-top:auto;padding-top:8px;display:flex;flex-direction:column;gap:8px}
.price{display:flex;align-items:baseline;gap:3px;flex-wrap:wrap}
.price strong{font-size:17px;font-weight:750}
.price span{font-size:13px;color:var(--muted)}
.price s{font-size:13px;color:var(--muted);margin-left:6px}
.add{width:100%;height:42px;border-radius:11px;border:0;background:var(--green);color:var(--on-green);font-weight:700;font-size:15px}
.add:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
.stepper{display:flex;align-items:center;justify-content:space-between;height:42px;border-radius:11px;background:var(--green-soft);color:var(--green);font-weight:750;font-size:14.5px}
.stepper span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stepper button{flex:none;width:42px;height:42px;border:0;background:transparent;font-size:22px;line-height:1;color:inherit;font-weight:600}
.stepper.sm{height:36px;width:132px}
.stepper.sm button{height:36px;width:38px;font-size:19px}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:8px}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:15;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--green);color:var(--on-green);border:0;border-radius:14px;padding:0 18px;height:56px;font-weight:700;font-size:15.5px;box-shadow:0 10px 28px rgba(0,0,0,.22);max-width:560px;margin:0 auto}
.foot{border-top:1px solid var(--line);margin-top:30px;padding:26px 0 34px;color:var(--muted);font-size:14px}
.foot-in{display:flex;flex-wrap:wrap;gap:18px 40px;justify-content:space-between}
.foot strong{color:var(--text);font-family:var(--serif);font-size:17px}
.foot p{margin:3px 0}
.foot a{color:inherit}
.foot .admin-link{font-size:13px}
.skeleton{padding:60px 16px;text-align:center;color:var(--muted)}

/* Dialogs */
dialog{border:0;padding:0;background:var(--surface);color:var(--text);border-radius:20px;width:calc(100% - 24px);max-width:560px;max-height:calc(100dvh - 32px);box-shadow:0 24px 60px rgba(0,0,0,.3)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(20,18,14,.5)}
dialog.small{max-width:400px}
@media (max-width:620px){
  dialog:not(.small){margin:auto 0 0;width:100%;max-width:100%;border-radius:20px 20px 0 0;max-height:94dvh}
}
.dlg{display:flex;flex-direction:column;min-height:0;flex:1}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-family:var(--serif);font-size:21px;font-weight:600}
.dlg-head .icon-btn{border:0;background:var(--surface-2);width:38px;height:38px}
.dlg-body{padding:18px;overflow-y:auto;flex:1;min-height:0}
.dlg-foot{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dlg-foot .spacer{flex:1}
.dlg-body>p{margin-bottom:12px}

/* Cart */
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:48px 1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .thumb{grid-row:span 2}
.line-main strong{display:block;font-size:15px}
.line-main span{font-size:13px;color:var(--muted)}
.line-total{font-weight:700;text-align:right}
.line .stepper{grid-column:2}
.line .rm{grid-column:3;justify-self:end;font-size:13px}
.thumb{width:48px;height:48px;border-radius:11px;overflow:hidden;background:hsl(var(--h,40) var(--tile-s) var(--tile-l));display:grid;place-items:center;font-size:26px;border:0;padding:0;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.sum{display:flex;justify-content:space-between;align-items:baseline;width:100%;font-size:15px;padding:2px 0}
.sum.total{font-size:18px;font-weight:750;padding-top:6px}
.note{width:100%;font-size:13.5px;padding:9px 12px;border-radius:10px;background:var(--green-soft);color:var(--green);font-weight:600}
.note.warn{background:var(--amber-soft);color:var(--amber)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:0;padding:0;margin:0 0 16px}
.seg label{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-weight:650}
.seg label small{font-weight:500;color:var(--muted);font-size:12.5px}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){border-color:var(--green);background:var(--green-soft)}
.seg label:has(input:focus-visible){outline:3px solid var(--ring)}
.done{text-align:center;padding:18px 4px}
.done .big{font-size:52px}
.done h3{font-family:var(--serif);font-size:24px;font-weight:600;margin:8px 0}
.done .actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.order-preview{white-space:pre-wrap;text-align:left;background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13px;margin-top:16px;max-height:220px;overflow:auto}

/* Admin */
.admin{padding-top:22px}
.admin-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.admin-head h1{font-family:var(--serif);font-size:30px;font-weight:600}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--amber-soft);color:var(--amber);font-size:14px;font-weight:600;margin-bottom:14px}
.banner.ok{background:var(--green-soft);color:var(--green)}
.banner .link{padding:0;color:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:10px 14px;border-radius:10px;font-weight:650;color:var(--muted)}
.tab[aria-selected=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow);border:1px solid var(--line)}
.tab .n{font-size:12px;background:var(--surface-2);padding:1px 7px;border-radius:99px;margin-left:4px}
.admin-toolbar{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px}
@media (min-width:720px){.admin-toolbar{grid-template-columns:1fr 240px auto}}
.admin-toolbar select{height:46px}
.stats{font-size:13.5px;color:var(--muted);margin:4px 0 12px}
.alist{display:flex;flex-direction:column;gap:8px}
.arow{display:grid;grid-template-columns:52px 1fr auto;grid-template-areas:"thumb main edit" "thumb price avail";gap:10px 12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
@media (min-width:760px){.arow{grid-template-columns:52px 1fr 150px 150px 42px;grid-template-areas:"thumb main price avail edit"}}
.arow .thumb{grid-area:thumb;width:52px;height:52px;cursor:pointer}
.arow-main{grid-area:main;min-width:0;cursor:pointer}
.arow-main strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow-main .meta{font-size:13px;color:var(--muted)}
.arow .pricebox{grid-area:price}
.arow .switch{grid-area:avail;justify-self:end}
.arow .icon-btn{grid-area:edit;justify-self:end}
.arow.off{background:var(--surface-2)}
.arow.off .thumb{filter:grayscale(1);opacity:.6}
.tag{font-size:11.5px;font-weight:750;padding:1px 7px;border-radius:99px;background:var(--wine-soft);color:var(--wine);margin-left:4px;vertical-align:1px}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.pricebox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.pricebox input{width:84px;height:40px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:0 10px;font-size:16px;font-weight:650;color:var(--text);text-align:right}
.pricebox input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--ring)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:600;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.slider{width:42px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.slider::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider::after{transform:translateX(16px)}
.switch input:focus-visible+.slider{outline:3px solid var(--ring);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.panel h2{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:6px}
.panel>p{color:var(--muted);margin-bottom:12px}
.panel .row-btns{display:flex;flex-wrap:wrap;gap:8px}
.steps{margin:0 0 14px;padding-left:20px}
.steps li{margin:4px 0}
.status{padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;margin-bottom:12px;background:var(--surface-2)}
.status.warn{background:var(--amber-soft);color:var(--amber)}
.status.ok{background:var(--green-soft);color:var(--green)}
.catlist{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px}
.catlist li{display:flex;align-items:center;gap:8px}
.catlist .emoji-in{width:52px;text-align:center;padding:0}
.catlist .name-in{flex:1;min-width:0}
.catlist .n{font-size:12.5px;color:var(--muted);width:56px;text-align:center;flex:none}
.catlist .icon-btn{width:38px;height:38px}
.catadd{display:flex;gap:8px}
.catadd .emoji-in{width:58px;text-align:center;flex:none}
.catadd .input{flex:1;min-width:0}
.settings-grid{display:grid;grid-template-columns:1fr;gap:0 14px}
@media (min-width:720px){.settings-grid{grid-template-columns:1fr 1fr}.settings-grid .full{grid-column:1/-1}}
.photo-row{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.photo-row .tile{width:132px;flex:none;border-radius:14px}
.photo-row .tile .emoji{font-size:50px}
.photo-actions{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.photo-actions .btns{display:flex;flex-wrap:wrap;gap:8px}
.emoji-picks{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.emoji-picks button{flex:none}
.emoji-picks button{width:34px;height:34px;border:0;background:transparent;border-radius:8px;font-size:20px;padding:0}
.emoji-picks button:hover{background:var(--surface-2)}
.emoji-field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.emoji-field input{width:58px;height:40px;text-align:center;border:1px solid var(--line);background:var(--bg);border-radius:9px;font-size:20px}
.form-err{color:var(--wine);font-weight:600;font-size:14px;width:100%}
.pin-in{font-size:26px!important;letter-spacing:.4em;text-align:center}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:100;max-width:calc(100vw - 32px);font-weight:600;font-size:14.5px;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">

function renderGrid() {
  const q = norm(ui.q.trim());

function ctlHTML(p, sm = false) {

function refreshCard(id) {

function stepQty(id, dir) {
  const p = byId(id); if (!p || !p.available) return;
  const step = unitOf(p.unit).step;
  let q = cart[id] ? round2(cart[id] + dir * step) : (dir > 0 ? 1 : 0);

/* ---------- Carrito ---------- */
function cartLines() {
  return Object.entries(cart).map(([id, q]) => { const p = byId(id); return p && p.available ? { p, q, total: round2(p.price * q) } : null; }).filter(Boolean);
}
function totals(method) {
  const s = data.settings;
  const sub = round2(cartLines().reduce((a, l) => a + l.total, 0));
  let ship = 0;
  if (method === 'delivery') ship = (s.freeDeliveryFrom > 0 && sub >= s.freeDeliveryFrom) ? 0 : s.deliveryFee;
  return { sub, ship, total: round2(sub + ship) };
}
function defaultMethod() { const s = data.settings; return s.delivery ? 'delivery' : 'pickup'; }

function updateCartUI() {
  const lines = cartLines(); const n = lines.length; const { sub } = totals();
  const b = $('#cartBtn');
  if (b) { b.classList.toggle('has', n > 0); b.querySelector('.count').textContent = n; b.querySelector('.cart-total').textContent = n ? money(sub) : 'Pedido'; }
  const bar = $('#cartBar'); const show = ui.view === 'shop' && n > 0;
  bar.hidden = !show;
  if (show) bar.innerHTML = `<span>Ver pedido · ${n} ${n === 1 ? 'producto' : 'productos'}</span><span>${money(sub)}</span>`;
  document.body.classList.toggle('has-cartbar', show);
  if ($('#cartDlg').open && ui.cartStep === 'items') renderCart();
}

function openCart() {
  if (ui.cartStep === 'done') ui.cartStep = 'items';
  ui.method = ui.method || defaultMethod();
  renderCart();
  const d = $('#cartDlg'); if (!d.open) d.showModal();
}

        <div class="line-total">${money(total)}</div>
        ${ctlHTML(p, true)}
        <button class="link danger rm" data-act="remove-line" data-id="${esc(p.id)}">Quitar</button>
      </li>`).join('')}</ul>
      <p style="margin-top:10px"><button class="link danger" data-act="clear-cart">Vaciar pedido</button></p>`;
    let note = '';
    if (s.delivery && s.freeDeliveryFrom > 0) note = faltan > 0 ? `<p class="note warn">🚚 Te faltan ${money(faltan)} para el envío gratis</p>` : `<p class="note">🚚 ¡Tienes envío gratis a domicilio!</p>`;
    foot.innerHTML = `${note}<div class="sum"><span>Subtotal</span><strong>${money(t.sub)}</strong></div>
      <button class="btn primary block" data-act="checkout">Continuar</button>
      <p class="fine">Los productos al peso pueden variar ligeramente en el importe final.</p>`;
    return;
  }
  // checkout
  const c = store.get(KEYS.customer, {}) || {};
  const both = s.delivery && s.pickup;
  if (!s.delivery) ui.method = 'pickup'; if (!s.pickup) ui.method = 'delivery';
  body.innerHTML = `<form id="orderForm" novalidate>
    <p style="margin-bottom:12px"><button type="button" class="link" data-act="back-items">← Volver al pedido</button></p>
    ${both ? `<fieldset class="seg"><legend class="sr">Entrega</legend>
      <label><input type="radio" name="method" value="delivery" ${ui.method === 'delivery' ? 'checked' : ''}>🚚 A domicilio<small>${s.deliveryFee > 0 ? money(s.deliveryFee) + (s.freeDeliveryFrom > 0 ? ` · gratis desde ${money(s.freeDeliveryFrom)}` : '') : 'Gratis'}</small></label>
      <label><input type="radio" name="method" value="pickup" ${ui.method === 'pickup' ? 'checked' : ''}>🏪 Recoger en tienda<small>Sin coste</small></label>
    </fieldset>` : `<p class="note" style="margin-bottom:14px">${ui.method === 'delivery' ? '🚚 Entrega a domicilio' : '🏪 Recogida en tienda'}</p>`}
    <label class="field"><span>Nombre</span><input name="name" required autocomplete="name" value="${esc(c.name || '')}"></label>
    <label class="field"><span>Teléfono</span><input name="phone" type="tel" required autocomplete="tel" inputmode="tel" value="${esc(c.phone || '')}"></label>
    <label class="field" id="addrField" ${ui.method === 'delivery' ? '' : 'hidden'}><span>Dirección de entrega</span><textarea name="address" rows="2" autocomplete="street-address" placeholder="Calle, número, piso y localidad">${esc(c.address || '')}</textarea></label>
    <label class="field"><span>¿Cuándo te viene bien?</span><select name="when">${['Lo antes posible', 'Hoy por la mañana', 'Hoy por la tarde', 'Mañana por la mañana', 'Mañana por la tarde'].map(w => `<option>${w}</option>`).join('')}</select></label>
    <label class="field"><span>Notas (opcional)</span><textarea name="notes" rows="2" placeholder="Ej.: plátanos no muy maduros, 2.º B…"></textarea></label>
  </form>`;
  renderCheckoutFoot();
  const f = $('#orderForm');
  f.addEventListener('change', e => { if (e.target.name === 'method') { ui.method = e.target.value; $('#addrField').hidden = ui.method !== 'delivery'; renderCheckoutFoot(); } });
  f.addEventListener('submit', submitOrder);
}
function renderCheckoutFoot() {
  const s = data.settings, t = totals(ui.method);
  const wa = waNumber(s.whatsapp);
  const label = wa ? 'Enviar pedido por WhatsApp' : s.email ? 'Enviar pedido por email' : 'Preparar pedido';
  const below = ui.method === 'delivery' && s.minOrder > 0 && t.sub < s.minOrder;
  $('#cartFoot').innerHTML = `
    ${below ? `<p class="note warn">El pedido mínimo a domicilio es de ${money(s.minOrder)}. Añade ${money(round2(s.minOrder - t.sub))} más o recoge en tienda.</p>` : ''}
    <div class="sum"><span>Subtotal</span><span>${money(t.sub)}</span></div>
    ${ui.method === 'delivery' ? `<div class="sum"><span>Envío</span><span>${t.ship ? money(t.ship) : 'Gratis'}</span></div>` : ''}
    <div class="sum total"><span>Total aprox.</span><span>${money(t.total)}</span></div>
    <button class="btn primary block" type="submit" form="orderForm" ${below ? 'disabled' : ''}>${label}</button>`;

function waNumber(v) {
  let d = String(v || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.length === 9 && /^[6789]/.test(d)) d = '34' + d;
  return d.length >= 10 ? d : '';
}
function orderRef() {
  const n = new Date(), p = x => String(x).padStart(2, '0');
  return `${p(n.getDate())}${p(n.getMonth() + 1)}-${p(n.getHours())}${p(n.getMinutes())}`;
}
function submitOrder(e) {
  e.preventDefault();
  const f = e.target, s = data.settings;
  const v = Object.fromEntries(new FormData(f));
  v.method = ui.method;
  $$('.field', f).forEach(x => { x.classList.remove('invalid'); x.querySelector('.err')?.remove(); });
  const errs = [];
  const bad = (name, msg) => { const el = f.elements[name].closest('.field'); el.classList.add('invalid'); el.insertAdjacentHTML('beforeend', `<span class="err">${msg}</span>`); errs.push(el); };
  if (!v.name.trim()) bad('name', 'Escribe tu nombre');
  if (v.phone.replace(/\D/g, '').length < 9) bad('phone', 'Escribe un teléfono válido');
  if (v.method === 'delivery' && !String(v.address || '').trim()) bad('address', 'Necesitamos la dirección para llevártelo');
  if (errs.length) { errs[0].querySelector('input,textarea')?.focus(); return; }
  const t = totals(v.method);
  if (v.method === 'delivery' && s.minOrder > 0 && t.sub < s.minOrder) return;
  const lines = cartLines(); const ref = orderRef();
  const L = [`🛒 *Pedido ${ref} · ${s.name}*`, ''];
  for (const { p, q, total } of lines) L.push(`• ${fmtQty(q, p.unit)} · ${p.name} — ${money(total)}`);
  L.push('', `Subtotal: ${money(t.sub)}`);
  if (v.method === 'delivery') L.push(`Envío: ${t.ship ? money(t.ship) : 'Gratis'}`);
  L.push(`*Total aprox.: ${money(t.total)}*`, '');
  L.push(`👤 ${v.name.trim()}`, `📞 ${v.phone.trim()}`);
  L.push(v.method === 'delivery' ? `📍 A domicilio: ${String(v.address).trim()}` : '🏪 Recogida en tienda');
  L.push(`🕘 ${v.when}`);
  if (v.notes.trim()) L.push(`📝 ${v.notes.trim()}`);
  const text = L.join('\n');
  const wa = waNumber(s.whatsapp);
  let url = '', channel = 'copy';
  if (wa) { url = `https://wa.me/${wa}?text=${encodeURIComponent(text)}`; channel = 'whatsapp'; }
  else if (s.email) { url = `mailto:${s.email}?subject=${encodeURIComponent(`Pedido ${ref} · ${v.name.trim()}`)}&body=${encodeURIComponent(text)}`; channel = 'email'; }
  store.set(KEYS.customer, { name: v.name.trim(), phone: v.phone.trim(), address: String(v.address || '').trim() });
  ui.lastOrder = { text, url, channel, name: v.name.trim().split(' ')[0], cart: { ...cart } };
  cart = {}; saveCart();
  ui.cartStep = 'done';
  if (url) { if (channel === 'whatsapp') window.open(url, '_blank', 'noopener'); else location.href = url; }
  renderCart(); updateCartUI(); if (ui.view === 'shop') renderGrid();
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Copiado ✔'); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    (document.querySelector('dialog[open]') || document.body).appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copiado ✔'); } catch { toast('No se pudo copiar'); }
    ta.remove();
  }
}

function refreshAdminChrome() {

function resizeImage(file, max = 560, quality = 0.74) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('imagen')); };
    img.src = url;
  });
}

}

/* ---------- Arranque ---------- */
async function loadPublished() {
  if (!isHosted) return null;
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 6000);
  try { const r = await fetch('productos.json', { cache: 'no-cache', signal: ctl.signal }); if (!r.ok) return null; const j = await r.json(); return j && Array.isArray(j.products) ? j : null; }
  catch { return null; } finally { clearTimeout(timer); }
}
async function init() {
  const local = store.get(KEYS.data, null);
  const remote = await loadPublished();
  publishedAt = remote ? remote.updatedAt || null : null;
  hasLocal = !!(local && Array.isArray(local.products));
  if (hasLocal && (!remote || time(local.updatedAt) >= time(remote.updatedAt))) data = normalize(local);
  else if (remote) { data = normalize(remote); hasLocal = false; }
  else data = normalize(SEED);
  cart = store.get(KEYS.cart, {}) || {}; pruneCart();
